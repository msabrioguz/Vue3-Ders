<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="">
</head>

<body>

    <header>
        <h1>Frontend'de öğrenilmesi gerekenler</h1>
    </header>

    <section id="frontEnd">
        <h2>Dinamik Stillendirme</h2>
        <div class="box" :style="{ borderColor: firstBox ? 'darkmagenta' : 'grey'}" @click="chooseBox('1')"></div>

        <div class="box" :style="{ borderColor: thirdBox ? 'darkmagenta' : 'grey'}" @click="chooseBox('3')"></div>
    </section>

    <script src="script.js"></script>

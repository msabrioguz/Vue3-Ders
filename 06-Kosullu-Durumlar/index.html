<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 Sayfası</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="">
</head>

<body>

    <header>
        <h1>Frontend'de öğrenilmesi gerekenler</h1>
    </header>

    <section id="frontEnd">
        <h2>Baştan Sona</h2>
        <div class="frontEndForm">
            <input type="text" v-model="newSkill" @keyup.enter="addSkill">
            <button @click="addSkill">Ekle</button>
        </div>

        <p v-if="skills.length === 0">Herhangi bir şey eklemediniz.</p>
        <ul v-else>
            <li v-for="(skill, index) in skills" :key="index" @click="removeSkill(index)">{{index}} - {{ skill }}</li>
        </ul>
    </section>

    <script src="script.js"></script>
</body>

</html>

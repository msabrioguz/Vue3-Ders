<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 Sayfası</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="">
</head>

<body>

    <header>
        <h1>Frontend'de öğrenilmesi gerekenler</h1>
    </header>

    <section id="frontEnd">
        <h2>Event Binding</h2>
        <button @click="arttir(5)">Fonksiyon ile 5 Arttır</button>
        <button v-on:click="azalt(5)">Fonksiyon ile 5 Azalt</button>
        <p v-once>Başlangıç Değeri: {{ counter }}</p>
        <p>Sonuç: {{ counter }}</p>
        <!-- <input type="text" v-on:input="setName($event)" v-bind:value="name"> -->
        <input v-model="name">
        <input v-model="lastName">
        <button v-on:click="clear">Temizle</button>
        <p>Adınız : {{ fullNameComputed }}</p>
        <input type="text" :value="fullName">
    </section>

    <script src="script.js"></script>
</body>

</html>
